- type: entity
  parent: STClothingOuterArmorStorageBasic # Can replace with our own parent later to disconnect from RU prototypes.
  id: STOWClothingOuterArmorT3VestBase
  suffix: STOW, Armor, T3, PvP
  abstract: true
  components:
  - type: STWeight
    self: 5.5 # Awaiting weight rebalance to increase this.
  - type: Storage # Contains 2 2x2, 2 1x3, and 3 1x2 slots.
    maxItemSize: Large
    blacklist:
      tags:
      - STArtifact
    grid:
      - 0,3,0,5
      - 2,3,2,4
      - 2,0,3,1
      - 4,3,4,4
      - 5,0,6,1
      - 6,3,6,4
      - 8,3,8,5
  - type: Tag
    tags:
      - BlockBelt
  - type: Armor # Blunt -20%/-5, Slash -20%/-5, Piercing -30%/-8, Explosion -25%. OW Change start - Lowered stats to allow loners to purchase and be faction equiv.
    armorClass: 1
    modifiers:
      flatReductions:
        Blunt: 0
        Slash: 0
        Piercing: 0
  - type: GrantsArtifactSlots
    slots: 1 # This is a significant disadvantage compared to the 2 slots, since it prevents you from running electrical artifacts.
 #- type: ExplosionResistance
 #  damageCoefficient: 0.75
  - type: Craftable
# Visual style for these armors is any low-coverage armor vest. No groin or shoulder protection ideally.

- type: entity
  parent: STOWClothingOuterArmorT3VestBase
  id: STOWClothingOuterArmorT3VestStalker
  name: ANA-III Tactical
  description: A popular last-generation armor system consisting of front, back, and side inserts with Kevlar linings. Imported into the Zone by a wide variety of users.
  components:
  - type: Sprite
    sprite: _Stalker/Objects/Clothing/outerClothing/ANA/Gray.rsi
  - type: Clothing
    sprite: _Stalker/Objects/Clothing/outerClothing/ANA/Gray.rsi
  - type: Armor # Blunt -20%/-5, Slash -20%/-5, Piercing -30%/-8, Explosion -25%. OW Change start - Lowered stats to allow loners to purchase and be faction equiv.
    armorClass: 3
    modifiers:
      flatReductions:
        Blunt: 5
        Slash: 5
        Piercing: 5
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.7
  - type: GrantsArtifactSlots
    slots: 1 # This is a significant disadvantage compared to the 2 slots, since it prevents you from running electrical artifacts.
  - type: ExplosionResistance
    damageCoefficient: 0.75 # OW Change End - Lowered stats to allow loners to purchase and be faction equiv.
  - type: Craftable
    
