- type: entity
  abstract: true
  parent: STClothingHeadBase 
  id: STOWClothingHeadHelmetT2PVPBase
  name: T2 combat helmet base
  suffix: STOW, T2, PVP
  components:
  - type: STWeight
    self: 2.1
  - type: Craftable
  - type: Armor
    armorClass: 2
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop

