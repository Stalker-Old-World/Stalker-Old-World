- type: entity
  parent: BaseItem
  id: TrashDetectorTier4
  # ST:OW begin
  #name: металлоискатель "Находка"
  #description: Очень Дорогой, металлоискатель модиффицированный с помощью частей гравитационных артефактов. Если порыться им в больших кучах мусора, то с большой вероятностью вы что-то найдете.
  #suffix: Stalker, металлоискатель
  name: metal detector "Nakhodka"
  description: A very expensive metal detector modified with gravity artifact parts. If you rummage through large piles of garbage, you have a very high chance to find something.
  suffix: Stalker, metal detector
  # ST:OW end
