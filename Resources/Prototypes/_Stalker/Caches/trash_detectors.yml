- type: entity
  parent: BaseItem
  id: TrashDetectorTier5
  # ST:OW begin
  #name: металлоискатель "Аномалист"
  #description: Крайне Дорогой, металлоискатель, является улучшенной версией металлоискателя "Находка". Обладает исключительными свойствами по поиску сборочных компонентов. Если порыться им в больших кучах мусора, то вы обязательно что-то найдете.
  #suffix: Stalker, металлоискатель
  name: metal detector "Anomalist"
  description: An extremely expensive metal detector and an improved version of "Nakhodka". It has exceptional properties for finding crafting components. If you rummage through large piles of garbage, you will definitely find something.
  suffix: Stalker, metal detector
  # ST:OW end
  components:
    - type: STWeight
      self: -2
    - type: Item
      size: Large
      shape:
        - 0,0,1,1
    - type: Sprite
      sprite: _Stalker/Objects/Tools/Trash_detectors/T5_trash_detector.rsi
