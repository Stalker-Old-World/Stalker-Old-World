- type: entity
  id: RandomTrashDetectorSpawner
  #name: спавнер случайного мусора (металлоискатель) # ST:OW
  name: random garbage spawner (metal detector) # ST:OW
  suffix: Stalker
  parent: FlexibleMarker
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
      state: icon
    - type: RandomSpawner
      prototypes:
      # ST:OW begin
      # Tier 1
      - STCraftSheetCopperT1
      - STCraftPlasticFittingT1
      - STCraftPinePlankT1
      - STCraftGlassT1
      - STCraftCottonFabricT1
      - STCraftBasicThreadKitT1
      - STCraftBasicPCBT1
    
      # Tier 2
      - STCraftSheetIronT2
      - STCraftPlasticFittingT2
      - STCraftBirchPlankT2
      - STCraftGlassT2
      - STCraftHideT2
      - STCraftTapeKitT2
      - STCraftStandardPCBT2
    
      # Electronics
      - STCraftBattery
      - STCraftCoil
      - STCraftCapacitor
      - STCraftTransformer
      
      # Currency 
      - Roubles500
      - Roubles1000
      - Roubles2000

      # Rare (T3 items)
      rarePrototypes:
      - STCraftSheetBrassT3
      - STCraftPlasticFittingT3
      - STCraftOakPlankT3
      - STCraftQuartzCrystalT3
      - TCraftSturdyHideT3
      - STCraftGlueKitT3
      - STCraftMultilayerPCBT3
    
      # Weapons
      - STWeaponShotgunMP153
      - STWeaponShotgunMossbergM88
      - WeaponPistolStalkerAPS
      - KhattabkaGrenade
      - STWeaponRifleAKS74U
      - STWeaponRifleSaiga545
      - STWeaponSniperMosin
      - STWeaponSniperSKS
    
      # Utility Items
      - DoubleEmergencyOxygenTankStalkerFilled
      - ExtendedEmergencyOxygenTankFilledStalker
      - Binocularus1
  
      # Jewelry
      - STGoldRingBigDiamond
      
      # Currency
      - Roubles5000
      rareChance: 0.15 # 15%

      epicPrototypes:
      - STCraftSheetAluminumT4
      - STCraftPlasticFittingT4
      - STCraftYewPlankT4
      - STCraftSapphireCrystalT4
      - TCraftPolymerFabricT4
      - STCraftIndustrialThreadStaplesKitT4
      - STCraftHighPerformanceChipT4
      epicChance: 0.006 # 0.6%

      legendaryPrototypes:
      - STCraftSheetSteelT5
      - STCraftPlasticFittingT5
      - STCraftRedWoodPlankT5
      - STCraftAluminumOxideT5
      - TCraftCompositeMaterialT5
      - STCraftHighStrengthKitT5
      - STCraftNanoChipT5
      legendaryChance: 0.0015 # 0.15% (about 1 in 667 successful spawns)
      # ST:OW end

- type: entity
  parent: BaseItem
  id: TrashDetectorTier1
  # ST:OW begin
  #name: металлоискатель "Простофиля"
  #description: Сделан из говна и палок, но если порыться им в больших кучах мусора, то возможно вы что-то найдете.
  #suffix: Stalker, металлоискатель
  name: metal detector "Prostofil"
  description: Made of junk and sticks, but if you rummage through large piles of garbage, you might find something.
  suffix: Stalker, metal detector
  # ST:OW end
  components:
    - type: STWeight
      self: 6
    - type: Item
      size: Large
      shape:
        - 0,0,1,1
    - type: Sprite
      sprite: _Stalker/Objects/Tools/Trash_detectors/T1_trash_detector.rsi
      state: icon
    - type: TrashDetector
      searchTime: 25
      probability: 0.50

